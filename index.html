<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ヨルシカ - Lời bài hát (Mobile)</title>
  <link rel="stylesheet" href="src/css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>ヨルシカ</h1>
    <input id="search" type="search" placeholder="Tìm bài hát..." />
  </header>

  <main id="main">
    <ul id="songList" class="song-list" aria-live="polite"></ul>
  </main>

  <!-- Modal hiển thị lời -->
  <div id="lyricsModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
      <button id="closeBtn" class="close-btn" aria-label="Đóng">×</button>
      <h2 id="lyricsTitle"></h2>
      <div id="lyricsBody" class="lyrics-body"></div>
      <div class="modal-footer">
        <a id="openSourceBtn" class="link-btn" target="_blank" rel="noopener">Mở nguồn</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script type="module" src="src/js/app.js"></script>
</body>
</html>
