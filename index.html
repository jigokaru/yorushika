<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ヨルシカ - Lời bài hát (Mobile)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>ヨルシカ</h1>
    <input id="search" type="search" placeholder="Tìm bài hát..." />
  </header>

  <main id="main">
    <ul id="songList" class="song-list"></ul>
  </main>

  <!-- Modal hiển thị lời -->
  <div id="lyricsModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeBtn" class="close-btn">×</button>
      <h2 id="lyricsTitle"></h2>
      <div id="lyricsBody" class="lyrics-body"></div>
      <div class="modal-footer">
        <button id="openSourceBtn" class="link-btn">Mở nguồn lời (nếu có)</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
